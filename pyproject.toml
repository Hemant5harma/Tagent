[project]
name = "trade-agent"
version = "0.1.0"
description = "Human-confirmed MT5 trade automation with deterministic risk controls."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Trade Agent" }]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-telegram-bot>=22.0,<23",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "langgraph-checkpoint-postgres>=3.1,<4",
]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[project.scripts]
trade-agent = "trade_agent.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_agent"]

[tool.pytest.ini_options]
testpaths = ["tests", "connector/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# ruff-format owns wrapping. Long protocol URLs, JSON schemas, and user-facing
# messages remain readable as single logical lines, so do not duplicate its rule.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["trade_agent", "mt5_connector"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
